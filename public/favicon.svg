<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="pf-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="32" height="32" rx="9" fill="url(#pf-bg)" />
  
  <!-- Energetic fitness coin ring (partial dynamic arc) -->
  <circle cx="16" cy="16" r="10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="48 15" opacity="0.4" />
  
  <!-- Stylized Paise Fit "p" + upward momentum surge -->
  <path d="M10.5 24V8.5h5.5c3.3 0 6 2.7 6 6s-2.7 6-6 6h-5.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Ascending fitness pulse line through the center -->
  <path d="M12 14.5l2.2-2.5 2.8 3 4-4.5" stroke="url(#pf-glow)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Vitality energy dot -->
  <circle cx="22" cy="9.5" r="1.5" fill="#a7f3d0" />
</svg>
